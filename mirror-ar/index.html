<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirror — AR Face Paint Studio</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      video, canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1); /* Mirrors the camera stream */
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="status" id="status">Loading camera…</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
